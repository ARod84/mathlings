[project]
name = "mathlings-backend"
version = "0.1.0"
description = "Mathlings backend: API and the os-taxonomy importer"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "pydantic-settings>=2.4",
    "sqlmodel>=0.0.22",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "hypothesis>=6.100",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not slow'"
markers = [
    "slow: runs the real import against backend/vendor/os-taxonomy (run with -m slow)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# The maths text uses the real minus sign and the box character on purpose.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
# backend/alembic (the migrations folder) would otherwise make it look first-party.
known-third-party = ["alembic"]
