name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# A new push to a branch (or pull request) cancels the run that is still going for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      # setup-uv has published no major tag since v7, only full version tags.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python (the version in backend/.python-version)
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Apply every migration to a new, empty database
        env:
          MATHLINGS_DATABASE_PATH: ${{ runner.temp }}/migrations.db
        run: uv run alembic upgrade head

      - name: Test
        run: uv run pytest -m "not slow"

      - name: openapi.json matches the code
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code -- ../openapi.json

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Install Node (the version in frontend/.nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # Includes the test that compares src/api/schema.d.ts with ../openapi.json.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
